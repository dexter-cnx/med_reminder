name: med_reminder_offline
description: Offline-first medication reminder with local notifications, CSV localization, Hive storage, and native companion handoff.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  easy_localization: ^3.0.7
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_local_notifications: ^17.1.2
  image_picker: ^1.0.7
  path_provider: ^2.1.2
  path: ^1.8.3
  uuid: ^4.4.0
  timezone: ^0.9.4
  flutter_timezone: ^2.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/translations.csv
