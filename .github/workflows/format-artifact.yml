name: Format Artifact

on:
  push:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: dart format lib test
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-source
          path: |
            lib
            test
