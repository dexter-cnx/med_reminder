name: Format Artifact

on:
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format lib test tool
      - uses: actions/upload-artifact@v4
        with:
          name: formatted-source
          path: |
            lib
            test
            tool
