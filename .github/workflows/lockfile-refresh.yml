name: Lockfile Refresh

on:
  pull_request:

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format lib/services/notification_service.dart
      - name: Commit lockfile and formatting when needed
        shell: bash
        run: |
          if git diff --quiet -- pubspec.lock lib/services/notification_service.dart; then
            echo "Already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.lock lib/services/notification_service.dart
          git commit -m "Refresh lockfile for flutter_timezone 5"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
