name: CI

on:
  pull_request:
  push:

jobs:
  auto-format:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.format.outputs.changed }}
    steps:
      - name: Check out same-repo PR branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Flutter for formatter
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Resolve dependencies for formatter
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: flutter pub get

      - name: Auto-format and sync lockfile for same-repo PR
        id: format
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          dart format lib test tool
          if git diff --quiet -- lib test tool pubspec.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test tool pubspec.lock
          git commit -m "chore: sync format and dependency lock"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
          echo "changed=true" >> "$GITHUB_OUTPUT"

  flutter:
    needs: auto-format
    if: always() && needs.auto-format.result == 'success' && needs.auto-format.outputs.changed != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Cache Pub and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
            build
          key: ${{ runner.os }}-flutter-${{ hashFiles('pubspec.lock', 'pubspec.yaml', '.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - run: flutter pub get
      - run: make l10n-check
      - name: Run format check
        id: format_check
        run: make format-check
      - name: Show formatting diff
        if: failure() && steps.format_check.outcome == 'failure'
        run: |
          dart format lib test tool
          git diff -- lib test tool
      - run: make analyze
      - run: make test
      - name: Build Android debug APK
        run: make android-build
