name: CI

on:
  pull_request:
  push:

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Pub and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
            build
          key: ${{ runner.os }}-flutter-${{ hashFiles('pubspec.lock', 'pubspec.yaml', '.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-flutter-

      - run: flutter pub get
      - run: make l10n-check
      - run: make format-check
      - run: make analyze
      - run: make test
